# Project-wide Gradle settings.

# JVM Memory & Garbage Collection Configuration (Optimized for device RAM)
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX & Namespace Settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Code Style & Compiler Performance Settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.daemon.jvmargs=-Xmx1024m

# Gradle Build Speed Optimizations
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

android.aapt2FromMavenOverride=/data/data/com.itsaky.androidide/files/home/android-sdk/build-tools/35.0.0/aapt2
