# Project-wide Gradle settings.

# JVM Memory & Garbage Collection Configuration (Optimized for device RAM)
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX & Namespace Settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Code Style & Compiler Performance Settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.daemon.jvmargs=-Xmx1024m

# Gradle Build Speed Optimizations
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Network & SSL Connection Settings (prevents SSL peer shut down incorrectly & socket timeouts)
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.https.protocols=TLSv1.2,TLSv1.3
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
